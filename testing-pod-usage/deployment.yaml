apiVersion: apps/v1
kind: Deployment
metadata:
  name: dual-container-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dual-container
  template:
    metadata:
      labels:
        app: dual-container
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: type
                    operator: In
                    values:
                      - kwok

      tolerations:
        - key: "kwok.x-k8s.io/node"
          operator: "Exists"
          effect: "NoSchedule"

      containers:
        - name: app-container
          image: nginx
          resources:
            requests:
              cpu: "1"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1Gi"

        - name: sidecar-container
          image: busybox
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"