apiVersion: kwok.x-k8s.io/v1alpha1
kind: ClusterResourceUsage
metadata:
  name: dual-container-cluster-usage
spec:
  selector: {}

  usages:
    - containers:
        - app-container
      usage:
        cpu:
          expression: "1.5"
        memory:
          expression: "Quantity(\"800Mi\")"

    - containers:
        - sidecar-container
      usage:
        cpu:
          expression: "1"
        memory:
          expression: "Quantity(\"200Mi\")"