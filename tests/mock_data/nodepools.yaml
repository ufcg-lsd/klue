apiVersion: v1
kind: List
items:
- apiVersion: karpenter.sh/v1
  kind: NodePool
  metadata:
    name: default
  spec:
    disruption:
      budgets:
      - nodes: 10%
      consolidateAfter: 5m
      consolidationPolicy: WhenEmptyOrUnderutilized
    template:
      metadata: {}
      spec:
        expireAfter: Never
        nodeClassRef:
          name: default
          kind: KWOKNodeClass
          group: karpenter.kwok.sh
        requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
          - c6a.2xlarge
        - key: karpenter.sh/capacity-type
          operator: In
          values:
          - on-demand
        - key: kubernetes.io/arch
          operator: In
          values:
          - amd64
- apiVersion: karpenter.kwok.sh/v1alpha1
  kind: KWOKNodeClass
  metadata:
    name: default
