apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: monitoring
data:
  grafana.ini: |
    [server]
    domain = ${MINIKUBE_IP}
    root_url = http://${MINIKUBE_IP}:32000
    serve_from_sub_path = false

    [security]
    allow_embedding = true
    cookie_samesite = lax

    [auth.anonymous]
    enabled = true
    org_role = Viewer
