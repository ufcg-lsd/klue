apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: ${CLUSTER_NAME}
  region: us-east-1

nodeGroups:
  - name: ng-1-workers
    labels: { role: workers }
    instanceType: t2.xlarge
    desiredCapacity: 1
    privateNetworking: true  
    iam:
      instanceRoleARN: arn:aws:iam::463020534911:role/eks-loadtest
      instanceProfileARN: arn:aws:iam::463020534911:instance-profile/eks-loadtest
    tags:
      User: ${USERNAME}
      Environment: ${ENVIRONMENT}
      Name: ${CLUSTER_NAME}
      Product: ${PRODUCT}
      ApplicationName: ${APPLICATION_NAME}