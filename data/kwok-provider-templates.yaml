apiVersion: v1
kind: ConfigMap
metadata:
  name: kwok-provider-templates
  namespace: default
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: autoscaler-kwok
    meta.helm.sh/release-namespace: default
data:
  templates: |- 
    apiVersion: v1
    kind: List
    metadata:
      resourceVersion: ""
    items:
    - apiVersion: v1
      kind: Node
      metadata:
        name: kind-worker-template
        annotations: {}
        labels:
          type: kwok
          kwok.x-k8s.io/node: fake
          kwok-nodegroup: worker-group
      spec:
      status:
        capacity:
          cpu: "8"
          ephemeral-storage: 1019013632Ki
          memory: 16Gi
          pods: "110"
        allocatable:
          cpu: "8"
          ephemeral-storage: 1019013632Ki
          memory: 16Gi
          pods: "110"
        conditions:
        - lastHeartbeatTime: "2023-05-31T04:39:58Z"
          lastTransitionTime: "2023-05-31T04:39:46Z"
          type: Ready
          status: "True"
          reason: KubeletReady
          message: "fake node ready"
